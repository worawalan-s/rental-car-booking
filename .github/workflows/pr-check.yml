name: PR Check

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Code & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Syntax Check
        run: |
          node --check server.js
          node --check config/db.js
          if [ -d "models" ]; then for f in models/*.js; do [ -f "$f" ] && node --check "$f"; done; fi
          if [ -d "controllers" ]; then for f in controllers/*.js; do [ -f "$f" ] && node --check "$f"; done; fi
          if [ -d "routes" ]; then for f in routes/*.js; do [ -f "$f" ] && node --check "$f"; done; fi
          if [ -d "middleware" ]; then for f in middleware/*.js; do [ -f "$f" ] && node --check "$f"; done; fi

      - name: Run Tests
        run: npm test
